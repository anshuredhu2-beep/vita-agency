<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Shiv Shankar Agency</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; color: white; padding: 15px 20px; border-radius: 5px; }
        .logout-btn { background: #e74c3c; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; }
        .container { margin-top: 20px; background: white; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
        .form-group { margin-bottom: 15px; }
        input, button { padding: 10px; margin-right: 10px; }
        button { background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Shiv Shankar Agency - Dashboard</h2>
        <a href="/login" class="logout-btn">Logout</a>
    </div>

    <div class="container">
        <h3>Inventory & Billing Tally</h3>
        
        <!-- Add Item Form -->
        <div class="form-group">
            <input type="text" id="itemName" placeholder="Item Name">
            <input type="number" id="itemQty" placeholder="Quantity">
            <input type="number" id="itemPrice" placeholder="Price (₹)">
            <button onclick="addItem()">Add Item</button>
        </div>

        <!-- Items Table -->
        <table>
            <thead>
                <tr>
                    <th>Item Name</th>
                    <th>Quantity</th>
                    <th>Price (₹)</th>
                    <th>Total (₹)</th>
                </tr>
            phans</thead>
            <tbody id="itemTableBody">
                <tr>
                    <td>Sample Item</td>
                    <td>10</td>
                    <td>₹500</td>
                    <td>₹5000</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function addItem() {
            let name = document.getElementById('itemName').value;
            let qty = document.getElementById('itemQty').value;
            let price = document.getElementById('itemPrice').value;
            
            if(name && qty && price) {
                let tableBody = document.getElementById('itemTableBody');
                let total = qty * price;
                let row = `<tr>
                    <td>${name}</td>
                    <td>${qty}</td>
                    <td>₹${price}</td>
                    <td>₹${total}</td>
                </tr>`;
                tableBody.innerHTML += row;
                
                // Clear inputs
                document.getElementById('itemName').value = '';
                document.getElementById('itemQty').value = '';
                document.getElementById('itemPrice').value = '';
            } else {
                alert("Please fill all fields!");
            }
        }
    </script>

</body>
</html>
